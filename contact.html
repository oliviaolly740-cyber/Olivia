<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - HOLLY MOVERS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #1f2937; }
    h1, h2, .heading { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-2xl mx-auto px-6 py-20">
    <h1 class="heading text-5xl md:text-6xl">Send Us a Message</h1>
    <form id="quoteForm" class="glass p-10 rounded-3xl space-y-7">
      <!-- Same form fields as in index.html -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" id="name" placeholder="Full Name" required class="form-input w-full border border-gray-300 focus:border-blue-600 rounded-2xl px-7 py-4">
        <input type="tel" id="phone" placeholder="Telephone (with country code)" required class="form-input w-full border border-gray-300 focus:border-blue-600 rounded-2xl px-7 py-4">
      </div>
      <!-- ... rest of the form fields ... -->
      <button type="submit" class="btn-blue w-full py-6 rounded-3xl text-lg font-semibold">SUBMIT MOVE REQUEST</button>
    </form>
  </div>
</body>
</html>
