  <script type="module">


    // =====================================================
    // FIREBASE IMPORTS
    // =====================================================

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


    import {

      signInWithEmailAndPassword,

    }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



    // =====================================================
    // FIREBASE CONFIGURATION
    // =====================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyC9RLegycn1D7QkFshepdE5hj0KJFJF68M",

      authDomain:
        "olivia-a6e60.firebaseapp.com",

      projectId:
        "olivia-a6e60",

      storageBucket:
        "olivia-a6e60.firebasestorage.app",

      messagingSenderId:
        "184840699254",

      appId:
        "1:184840699254:web:71f438ef2f7d04a3f8ce57",

      measurementId:
        "G-RBQCS16HP9"

    };



    // =====================================================
    // CLOUDINARY
    // =====================================================

    const CLOUDINARY_CLOUD_NAME =
      "xb8j8gkd";


    const CLOUDINARY_UPLOAD_PRESET =
      "olivia_uploads";



    // =====================================================
    // ADMIN
    // =====================================================

    const ADMIN_EMAIL =
      "admin@hollymovers.com";



    // =====================================================
    // INITIALIZE
    // =====================================================

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);



    // =====================================================
    // DOM ELEMENTS
    // =====================================================

    const loginSection =
      document.getElementById("loginSection");


    const uploadSection =
      document.getElementById("uploadSection");


    const authArea =
      document.getElementById("authArea");


    const loginForm =
      document.getElementById("loginForm");


    const loginError =
      document.getElementById("loginError");


    const loginBtn =
      document.getElementById("loginBtn");


    const mediaInput =
      document.getElementById("mediaInput");


    const descriptionInput =
      document.getElementById("descriptionInput");


    const uploadForm =
      document.getElementById("uploadForm");


    const uploadBtn =
      document.getElementById("uploadBtn");


    const uploadIcon =
      document.getElementById("uploadIcon");


    const btnText =
      document.getElementById("btnText");


    const uploadStatus =
      document.getElementById("uploadStatus");


    const mediaPreview =
      document.getElementById("mediaPreview");


    const previewImage =
      document.getElementById("previewImage");


    const previewVideo =
      document.getElementById("previewVideo");


    const fileInfo =
      document.getElementById("fileInfo");


    const galleryGrid =
      document.getElementById("galleryGrid");



    // =====================================================
    // HELPER: IS ADMIN
    // =====================================================

    function isAdminUser(user) {

      return (
        user &&
        user.email &&
        user.email.toLowerCase() ===
          ADMIN_EMAIL.toLowerCase()
      );

    }



    // =====================================================
    // STATUS
    // =====================================================

    function showStatus(
      message,
      type = "info"
    ) {

      uploadStatus.className =
        "text-sm text-center p-4 rounded-xl";


      if (type === "success") {

        uploadStatus.classList.add(
          "bg-green-100",
          "text-green-700"
        );

      }

      else if (type === "error") {

        uploadStatus.classList.add(
          "bg-red-100",
          "text-red-700"
        );

      }

      else {

        uploadStatus.classList.add(
          "bg-blue-100",
          "text-blue-700"
        );

      }


      uploadStatus.textContent =
        message;

    }



    // =====================================================
    // CLOUDINARY UPLOAD
    // =====================================================

    async function uploadToCloudinary(
      file
    ) {

      const formData =
        new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
      );


      formData.append(
        "folder",
        "holly-movers-gallery"
      );


      const response =
        await fetch(

          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`,

          {
            method: "POST",
            body: formData
          }

        );


      let data;


      try {

        data =
          await response.json();

      }

      catch {

        throw new Error(
          "Cloudinary returned an invalid response."
        );

      }


      if (!response.ok) {

        console.error(
          "Cloudinary error:",
          data
        );


        throw new Error(
          data?.error?.message ||
          "Cloudinary upload failed."
        );

      }


      if (!data.secure_url) {

        throw new Error(
          "Cloudinary did not return the uploaded file URL."
        );

      }


      return {

        url:
          data.secure_url,

        type:
          data.resource_type === "video"
            ? "video"
            : "image",

        publicId:
          data.public_id || ""

      };

    }



    // =====================================================
    // SAVE TO FIRESTORE
    // =====================================================

    async function saveToFirestore(
      media,
      description
    ) {

      const user =
        auth.currentUser;


      if (!user) {

        throw new Error(
          "Your admin session has expired. Please log in again."
        );

      }


      const docRef =
        await addDoc(

          collection(
            db,
            "gallery"
          ),

          {

            url:
              media.url,

            type:
              media.type,

            publicId:
              media.publicId,

            description:
              description || "",

            uploadedBy:
              user.email,

            timestamp:
              serverTimestamp()

          }

        );


      return docRef.id;

    }



    // =====================================================
    // LOAD GALLERY
    // =====================================================

    async function loadGallery() {

      galleryGrid.innerHTML = `

        <div
          class="col-span-full
                 text-center py-16"
        >

          <i
            class="fa-solid fa-spinner
                   fa-spin text-4xl
                   text-indigo-600"
          ></i>

          <p class="text-gray-500 mt-4">
            Loading gallery...
          </p>

        </div>

      `;


      try {

        const q =
          query(

            collection(
              db,
              "gallery"
            ),

            orderBy(
              "timestamp",
              "desc"
            )

          );


        const snapshot =
          await getDocs(q);


        galleryGrid.innerHTML = "";


        if (snapshot.empty) {

          galleryGrid.innerHTML = `

            <div
              class="col-span-full
                     text-center py-20"
            >

              <i
                class="fa-solid fa-images
                       text-6xl
                       text-gray-300 mb-4"
              ></i>

              <p class="text-gray-400">
                No moments have been uploaded yet.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach(
          (doc) => {

            const data =
              doc.data();


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "gallery-card";


            const type =
              data.type === "video"
                ? "video"
                : "image";


            // ---------------------------------------------
            // MEDIA
            // ---------------------------------------------

            if (type === "video") {

              const video =
                document.createElement(
                  "video"
                );


              video.src =
                data.url || "";


              video.className =
                "gallery-media";


              video.controls =
                true;


              video.playsInline =
                true;


              video.preload =
                "metadata";


              card.appendChild(
                video
              );


              const badge =
                document.createElement(
                  "div"
                );


              badge.className =
                "absolute top-3 right-3 " +
                "bg-black/70 text-white " +
                "text-xs px-3 py-1 " +
                "rounded-full";


              badge.innerHTML =
                '<i class="fa-solid fa-video mr-1"></i> Video';


              card.appendChild(
                badge
              );

            }

            else {

              const image =
                document.createElement(
                  "img"
                );


              image.src =
                data.url || "";


              image.alt =
                data.description ||
                "Holly Movers";


              image.className =
                "gallery-media";


              image.loading =
                "lazy";


              card.appendChild(
                image
              );

            }



            // ---------------------------------------------
            // DESCRIPTION
            // ---------------------------------------------

            if (
              data.description &&
              data.description.trim()
            ) {

              const description =
                document.createElement(
                  "div"
                );


              description.className =
                "description-box";


              const text =
                document.createElement(
                  "p"
                );


              text.className =
                "text-sm md:text-base font-medium";


              text.textContent =
                data.description;


              description.appendChild(
                text
              );


              card.appendChild(
                description
              );

            }

          }

        );


      }

      catch (error) {

        console.error(
          "Gallery error:",
          error
        );


        galleryGrid.innerHTML = `

          <div
            class="col-span-full
                   bg-red-50
                   text-red-600
                   p-6
                   rounded-2xl
                   text-center"
          >

            <i
              class="fa-solid
                     fa-triangle-exclamation
                     text-3xl mb-3"
            ></i>

            <p class="font-semibold">
              Unable to load the gallery.
            </p>

            <p class="text-sm mt-2">
              ${error.message}
            </p>

          </div>

        `;

      }

    }



    // =====================================================
    // AUTH UI
    // =====================================================

    function updateAuthUI(
      user
    ) {

      if (
        isAdminUser(user)
      ) {

        authArea.innerHTML = `

          <span
            class="text-sm text-gray-600"
          >
            Admin: ${user.email}
          </span>

          <button
            id="logoutBtn"
            class="bg-gray-200
                   hover:bg-gray-300
                   text-gray-800
                   px-4 py-2
                   rounded-xl
                   text-sm
                   font-medium"
          >
            Logout
          </button>

        `;


        loginSection.classList.add(
          "hidden"
        );


        uploadSection.classList.remove(
          "hidden"
        );


        document
          .getElementById("logoutBtn")
          .addEventListener(
            "click",
            () => signOut(auth)
          );

      }

      else {

        authArea.innerHTML = `

          <button
            id="showLoginBtn"
            class="bg-indigo-600
                   hover:bg-indigo-700
                   text-white
                   px-5 py-2.5
                   rounded-xl
                   text-sm
                   font-medium"
          >
            Admin Login
          </button>

        `;


        uploadSection.classList.add(
          "hidden"
        );


        loginSection.classList.add(
          "hidden"
        );


        document
          .getElementById("showLoginBtn")
          .addEventListener(
            "click",
            () => {

              loginSection.classList.remove(
                "hidden"
              );

              loginSection.scrollIntoView({
                behavior: "smooth"
              });

            }
          );

      }

    }



    // =====================================================
    // LOGIN
    // =====================================================

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document
            .getElementById(
              "loginEmail"
            )
            .value
            .trim();


        const password =
          document
            .getElementById(
              "loginPassword"
            )
            .value;


        loginError.classList.add(
          "hidden"
        );


        loginBtn.disabled =
          true;


        loginBtn.textContent =
          "Signing in...";


        try {

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          if (
            !isAdminUser(
              credential.user
            )
          ) {

            await signOut(auth);


            throw new Error(
              "This account is not authorized as the website administrator."
            );

          }


        }

        catch (error) {

          console.error(
            "Login error:",
            error
          );


          loginError.textContent =
            error.message;


          loginError.classList.remove(
            "hidden"
          );

        }

        finally {

          loginBtn.disabled =
            false;


          loginBtn.textContent =
            "Sign In";

        }

      }
    );



    // =====================================================
    // FILE PREVIEW
    // =====================================================

    mediaInput.addEventListener(
      "change",
      () => {

        const file =
          mediaInput.files[0];


        if (!file) {

          mediaPreview.classList.add(
            "hidden"
          );

          fileInfo.textContent =
            "";

          return;

        }


        fileInfo.textContent =
          `${file.name} • ${(file.size / 1024 / 1024).toFixed(2)} MB`;


        const previewURL =
          URL.createObjectURL(
            file
          );


        if (
          file.type.startsWith(
            "video/"
          )
        ) {

          previewImage.classList.add(
            "hidden"
          );


          previewVideo.classList.remove(
            "hidden"
          );


          previewVideo.src =
            previewURL;

        }

        else {

          previewVideo.classList.add(
            "hidden"
          );


          previewVideo.pause();


          previewVideo.src =
            "";


          previewImage.classList.remove(
            "hidden"
          );


          previewImage.src =
            previewURL;

        }


        mediaPreview.classList.remove(
          "hidden"
        );

      }
    );



    // =====================================================
    // UPLOAD
    // =====================================================

    uploadForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const user =
          auth.currentUser;


        // -----------------------------------------------
        // ADMIN CHECK
        // -----------------------------------------------

        if (
          !isAdminUser(user)
        ) {

          showStatus(
            "Please log in with the administrator account first.",
            "error"
          );

          return;

        }


        const file =
          mediaInput.files[0];


        if (!file) {

          showStatus(
            "Please select a photo or video.",
            "error"
          );

          return;

        }


        const description =
          descriptionInput.value.trim();


        // -----------------------------------------------
        // DISABLE
        // -----------------------------------------------

        uploadBtn.disabled =
          true;


        uploadIcon.className =
          "fa-solid fa-spinner fa-spin";


        btnText.textContent =
          "UPLOADING...";


        try {

          // ---------------------------------------------
          // CLOUDINARY
          // ---------------------------------------------

          showStatus(
            "Uploading your photo/video...",
            "info"
          );


          const media =
            await uploadToCloudinary(
              file
            );


          console.log(
            "Cloudinary upload successful:",
            media
          );


          // ---------------------------------------------
          // FIRESTORE
          // ---------------------------------------------

          showStatus(
            "Saving your photo/video to the gallery...",
            "info"
          );


          const documentId =
            await saveToFirestore(
              media,
              description
            );


          console.log(
            "Gallery document created:",
            documentId
          );


          // ---------------------------------------------
          // SUCCESS
          // ---------------------------------------------

          showStatus(
            "✓ Upload successful! Visitors can now see it in the gallery.",
            "success"
          );


          // Reset form

          uploadForm.reset();


          mediaPreview.classList.add(
            "hidden"
          );


          previewImage.src =
            "";


          previewVideo.pause();


          previewVideo.src =
            "";


          fileInfo.textContent =
            "";


          // Reload gallery

          await loadGallery();

        }

        catch (error) {

          console.error(
            "COMPLETE UPLOAD ERROR:",
            error
          );


          let message =
            error.message ||
            "Unknown upload error.";


          if (
            message.includes(
              "upload preset"
            )
          ) {

            message =
              "Cloudinary rejected the upload preset. Make sure 'olivia_uploads' is an UNSIGNED upload preset.";

          }


          else if (
            message.includes(
              "permission"
            ) ||
            message.includes(
              "Missing or insufficient"
            )
          ) {

            message =
              "Firebase rejected the upload. Check your Firestore rules and make sure admin@hollymovers.com is authorized.";

          }


          showStatus(
            "Upload failed: " +
            message,
            "error"
          );

        }

        finally {

          uploadBtn.disabled =
            false;


          uploadIcon.className =
            "fa-solid fa-upload";


          btnText.textContent =
            "UPLOAD TO GALLERY";

        }

      }
    );



    // =====================================================
    // AUTH STATE
    // =====================================================

    onAuthStateChanged(
      auth,
      (user) => {

        console.log(
          "Current user:",
          user
            ? user.email
            : "Not logged in"
        );


        updateAuthUI(
          user
        );

      }
    );



    // =====================================================
    // START GALLERY
    // =====================================================
