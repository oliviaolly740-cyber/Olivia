<!-- HEADER -->

<!-- ADMIN LOGIN -->
<div
  id="loginSection"
  class="max-w-md mx-auto mb-16 bg-white p-8 rounded-2xl shadow-xl hidden"
>

  <div class="text-center mb-6">

  </div>

  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey: "AIzaSyC9RLegycn1D7QkFshepdE5hj0KJFJF68M",

      authDomain: "olivia-a6e60.firebaseapp.com",

      projectId: "olivia-a6e60",

      storageBucket: "olivia-a6e60.firebasestorage.app",

      messagingSenderId: "184840699254",

      appId: "1:184840699254:web:71f438ef2f7d04a3f8ce57",

      measurementId: "G-RBQCS16HP9"

    };


    // =====================================================
    // CLOUDINARY CONFIG
    // =====================================================

    const CLOUDINARY_CLOUD_NAME = "xb8j8gkd";

    const CLOUDINARY_UPLOAD_PRESET = "olivia_uploads";


    // =====================================================
    // ADMIN
    // =====================================================

    const ADMIN_EMAIL = "admin@hollymovers.com";


    // =====================================================
    // INITIALIZE FIREBASE
    // =====================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // =====================================================
    // ELEMENTS
    // =====================================================

    const mediaInput =
      document.getElementById("mediaInput");

    const descriptionInput =
      document.getElementById("descriptionInput");

    const mediaPreview =
      document.getElementById("mediaPreview");

    const previewImage =
      document.getElementById("previewImage");

    const previewVideo =
      document.getElementById("previewVideo");

    const uploadForm =
      document.getElementById("uploadForm");

    const uploadBtn =
      document.getElementById("uploadBtn");

    const btnText =
      document.getElementById("btnText");

    const uploadIcon =
      document.getElementById("uploadIcon");

    const uploadStatus =
      document.getElementById("uploadStatus");

    const fileInfo =
      document.getElementById("fileInfo");


    // =====================================================
    // STATUS MESSAGE
    // =====================================================

    function showStatus(message, type = "info") {

      uploadStatus.classList.remove(
        "hidden",
        "bg-green-100",
        "text-green-700",
        "bg-red-100",
        "text-red-700",
        "bg-blue-100",
        "text-blue-700"
      );


      if (type === "success") {

        uploadStatus.classList.add(
          "bg-green-100",
          "text-green-700"
        );

      } else if (type === "error") {

        uploadStatus.classList.add(
          "bg-red-100",
          "text-red-700"
        );

      } else {

        uploadStatus.classList.add(
          "bg-blue-100",
          "text-blue-700"
        );

      }


      uploadStatus.textContent = message;

    }


    // =====================================================
    // CLOUDINARY UPLOAD
    // =====================================================

    async function uploadToCloudinary(file) {

      if (!file) {

        throw new Error(
          "No photo or video was selected."
        );

      }


      console.log(
        "Starting Cloudinary upload:",
        file.name,
        file.type,
        file.size
      );


      const formData = new FormData();

      formData.append(
        "file",
        file
      );

      formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
      );

      formData.append(
        "folder",
        "holly-movers-gallery"
      );


      const response = await fetch(

        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`,

        {
          method: "POST",
          body: formData
        }

      );


      let data;

      try {

        data = await response.json();

      } catch {

        throw new Error(
          "Cloudinary returned an invalid response."
        );

      }


      if (!response.ok) {

        console.error(
          "Cloudinary error:",
          data
        );


        throw new Error(
          data?.error?.message ||
          "Cloudinary upload failed."
        );

      }


      if (!data.secure_url) {

        throw new Error(
          "Cloudinary uploaded the file but did not return a URL."
        );

      }


      console.log(
        "Cloudinary upload successful:",
        data.secure_url
      );


      return {

        url: data.secure_url,

        resourceType: data.resource_type,

        publicId: data.public_id

      };

    }


    // =====================================================
    // FIRESTORE
    // =====================================================

    async function saveToFirestore(media) {

      if (!auth.currentUser) {

        throw new Error(
          "You are no longer logged in."
        );

      }


      console.log(
        "Saving media to Firestore..."
      );


      const docRef = await addDoc(

        collection(
          db,
          "gallery"
        ),

        {

          url: media.url,

          description: media.description || "",

          type: media.resourceType,

          publicId: media.publicId || "",

          timestamp: serverTimestamp(),

          uploadedBy:
            auth.currentUser.email

        }

      );


      console.log(
        "Firestore document created:",
        docRef.id
      );


      return docRef.id;

    }


    // =====================================================
    // LOAD GALLERY
    // =====================================================

    async function loadGallery() {

      const grid =
        document.getElementById("galleryGrid");


      grid.innerHTML = `

        <div class="col-span-full text-center py-16">

          <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i>

          <p class="text-gray-500 mt-4">
            Loading gallery...
          </p>

        </div>

      `;


      try {

        const q = query(

          collection(
            db,
            "gallery"
          ),

          orderBy(
            "timestamp",
            "desc"
          )

        );


        const snapshot =
          await getDocs(q);


        if (snapshot.empty) {

          grid.innerHTML = `

            <div class="col-span-full text-center py-20">

              <i class="fa-solid fa-image text-6xl text-gray-300 mb-4"></i>

              <p class="text-gray-400">
                No moments yet.
              </p>

            </div>

          `;

          return;

        }


        grid.innerHTML = "";


        snapshot.forEach((doc) => {

          const data = doc.data();

          const card =
            document.createElement("div");


          card.className =
            "group relative overflow-hidden rounded-3xl aspect-square shadow-md bg-black";


          const isVideo =
            data.type === "video";


          if (isVideo) {

            const video =
              document.createElement("video");

            video.src = data.url;

            video.className =
              "w-full h-full object-cover";

            video.muted = true;

            video.loop = true;

            video.playsInline = true;

            video.controls = true;


            card.appendChild(video);


            const label =
              document.createElement("div");

            label.className =
              "absolute top-3 right-3 bg-black/60 text-white text-xs px-2 py-1 rounded-full";

            label.innerHTML =
              '<i class="fa-solid fa-video"></i> Video';

            card.appendChild(label);

          } else {

            const img =
              document.createElement("img");

            img.src = data.url;

            img.className =
              "w-full h-full object-cover transition-transform group-hover:scale-110";

            img.alt =
              data.description ||
              "Moment";

            img.loading = "lazy";


            img.onerror = function () {

              console.error(
                "Image failed to load:",
                data.url
              );

              this.alt =
                "Image failed to load";

            };


            card.appendChild(img);

          }


          if (data.description) {

            const overlay =
              document.createElement("div");

            overlay.className =
              "absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-all flex items-end p-5";


            const text =
              document.createElement("p");

            text.className =
              "text-white text-sm font-medium";

            text.textContent =
              data.description;


            overlay.appendChild(text);

            card.appendChild(overlay);

          }


          grid.appendChild(card);

        });

      } catch (error) {

        console.error(
          "Gallery loading error:",
          error
        );


        grid.innerHTML = `

          <div class="col-span-full text-center py-10">

            <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-4"></i>

            <p class="text-red-500 font-medium">
              Failed to load gallery
            </p>

            <p class="text-gray-500 text-sm mt-2">
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    // =====================================================
    // AUTH UI
    // =====================================================

    function updateAuthUI(user) {

      const authArea =
        document.getElementById("authArea");

      const loginSection =
        document.getElementById("loginSection");

      const uploadSection =
        document.getElementById("uploadSection");


      if (
        user &&
        user.email === ADMIN_EMAIL
      ) {

        authArea.innerHTML = `

          <span class="text-sm text-gray-600">
            Admin: ${user.email}
          </span>

          <button
            id="logoutBtn"
            class="bg-gray-200 hover:bg-gray-300
                   text-gray-800 px-4 py-2
                   rounded-xl text-sm font-medium"
          >
            Logout
          </button>

        `;


        document
          .getElementById("logoutBtn")
          .onclick = () =>
            signOut(auth);


        loginSection.classList.add(
          "hidden"
        );

        uploadSection.classList.remove(
          "hidden"
        );

      } else {

        authArea.innerHTML = `

          <button
            id="showLoginBtn"
            class="bg-indigo-600 hover:bg-indigo-700
                   text-white px-5 py-2.5
                   rounded-xl text-sm font-medium"
          >
            Admin Login
          </button>

        `;


        document
          .getElementById("showLoginBtn")
          .onclick = () => {

            loginSection.classList.remove(
              "hidden"
            );

            loginSection.scrollIntoView({
              behavior: "smooth"
            });

          };


        loginSection.classList.add(
          "hidden"
        );

        uploadSection.classList.add(
          "hidden"
        );

      }

    }


    // =====================================================
    // LOGIN
    // =====================================================

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async (e) => {

          e.preventDefault();


          const email =
            document
              .getElementById("loginEmail")
              .value
              .trim();


          const password =
            document
              .getElementById("loginPassword")
              .value;


          const errorEl =
            document
              .getElementById("loginError");


          const loginBtn =
            document
              .getElementById("loginBtn");


          errorEl.classList.add(
            "hidden"
          );


          loginBtn.disabled = true;

          loginBtn.textContent =
            "Signing in...";


          try {

            const cred =
              await signInWithEmailAndPassword(
                auth,
                email,
                password
              );


            if (
              cred.user.email !==
              ADMIN_EMAIL
            ) {

              await signOut(auth);

              throw new Error(
                "This account is not authorized as admin."
              );

            }

          } catch (error) {

            console.error(
              "Login error:",
              error
            );


            errorEl.textContent =
              error.message;


            errorEl.classList.remove(
              "hidden"
            );

          } finally {

            loginBtn.disabled = false;

            loginBtn.textContent =
              "Sign In";

          }

        }
      );


    // =====================================================
    // FILE PREVIEW
    // =====================================================

    mediaInput.addEventListener(
      "change",
      () => {

        const file =
          mediaInput.files[0];


        if (!file) {

          mediaPreview.classList.add(
            "hidden"
          );

          fileInfo.textContent = "";

          return;

        }


        fileInfo.textContent =
          `${file.name} • ${(file.size / 1024 / 1024).toFixed(2)} MB`;


        const url =
          URL.createObjectURL(file);


        const isVideo =
          file.type.startsWith(
            "video/"
          );


        if (isVideo) {

          previewImage.classList.add(
            "hidden"
          );

          previewVideo.classList.remove(
            "hidden"
          );

          previewVideo.src = url;

        } else {

          previewVideo.classList.add(
            "hidden"
          );

          previewVideo.pause();

          previewVideo.src = "";

          previewImage.classList.remove(
            "hidden"
          );

          previewImage.src = url;

        }


        mediaPreview.classList.remove(
          "hidden"
        );

      }
    );


    // =====================================================
    // UPLOAD
    // =====================================================

    uploadForm.addEventListener(
      "submit",
      async (e) => {

        e.preventDefault();


        // CHECK LOGIN

        if (
          !auth.currentUser ||
          auth.currentUser.email !==
          ADMIN_EMAIL
        ) {

          showStatus(
            "Please log in as the administrator first.",
            "error"
          );

          return;

        }


        // CHECK FILE

        const file =
          mediaInput.files[0];


        if (!file) {

          showStatus(
            "Please select a photo or video.",
            "error"
          );

          return;

        }


        // DISABLE BUTTON

        uploadBtn.disabled = true;

        uploadIcon.className =
          "fa-solid fa-spinner fa-spin";

        btnText.textContent =
          "UPLOADING...";


        try {

          // -----------------------------------------------
          // STEP 1: CLOUDINARY
          // -----------------------------------------------

          showStatus(
            "Step 1 of 2: Uploading your photo/video...",
            "info"
          );


          const media =
            await uploadToCloudinary(
              file
            );


          console.log(
            "Cloudinary result:",
            media
          );


          // -----------------------------------------------
          // STEP 2: FIRESTORE
          // -----------------------------------------------

          showStatus(
            "Step 2 of 2: Saving to gallery...",
            "info"
          );


          media.description =
            descriptionInput.value.trim();


          await saveToFirestore(
            media
          );


          // -----------------------------------------------
          // SUCCESS
          // -----------------------------------------------

          showStatus(
            "✓ Uploaded successfully! Your photo is now in the gallery.",
            "success"
          );


          uploadForm.reset();


          mediaPreview.classList.add(
            "hidden"
          );


          previewImage.src = "";

          previewVideo.pause();

          previewVideo.src = "";

          fileInfo.textContent = "";


          // Reload gallery

          await loadGallery();


        } catch (error) {

          console.error(
            "UPLOAD ERROR:",
            error
          );


          showStatus(
            "Upload failed: " +
            error.message,
            "error"
          );

        } finally {

          uploadBtn.disabled = false;

          uploadIcon.className =
            "fa-solid fa-upload";

          btnText.textContent =
            "UPLOAD TO GALLERY";

        }

      }
    );


    // =====================================================
    // AUTH STATE
    // =====================================================

    onAuthStateChanged(
      auth,
      (user) => {

        console.log(
          "Authentication state:",
          user
            ? user.email
            : "Not logged in"
        );


        updateAuthUI(user);

      }
    );


    // =====================================================
    // LOAD GALLERY
    // =====================================================

    loadGallery();

  </script>
