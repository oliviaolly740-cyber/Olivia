<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - HOLLY MOVERS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #1f2937; }
    h1, h2, .heading { font-family: 'Playfair Display', serif; }
    .gallery-grid img { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .gallery-grid img:hover { transform: scale(1.05); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-7xl mx-auto px-6 py-20">
    <!-- Header -->
    <h1 class="heading text-5xl md:text-6xl text-center mb-16">Moments That Matter</h1>

    <!-- Upload Section -->
    <div class="max-w-2xl mx-auto mb-16 bg-white p-8 rounded-2xl shadow-xl">
      <div class="text-center mb-8">
        <i class="fa-solid fa-cloud-arrow-up text-5xl text-indigo-600 mb-4"></i>
        <h2 class="heading text-3xl">Upload a Moment</h2>
        <p class="text-gray-600 mt-2">Photos live on Cloudinary • Descriptions saved on Firebase</p>
      </div>

      <form id="uploadForm" class="space-y-6">
        <!-- Photo Upload -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Choose Photo</label>
          <input type="file" id="photoInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Description (optional)</label>
          <textarea id="descriptionInput" rows="3" class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" placeholder="A beautiful moment from last weekend..."></textarea>
        </div>

        <!-- Preview -->
        <div id="photoPreview" class="hidden border-2 border-dashed border-gray-300 rounded-2xl overflow-hidden">
          <img id="previewImage" class="w-full h-64 object-cover">
        </div>

        <!-- Submit -->
        <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 px-8 rounded-2xl flex items-center justify-center gap-3 transition-all">
          <i class="fa-solid fa-upload"></i>
          UPLOAD TO GALLERY
        </button>
      </form>
    </div>

    <!-- Gallery -->
    <div class="grid md:grid-cols-3 gap-8" id="galleryGrid"></div>

    <!-- Footer note -->
    <div class="text-center mt-16 text-sm text-gray-500">
      Built with <span class="text-indigo-600">Tailwind + Firebase + Cloudinary</span><br>
      Upload instantly • Your photos are safe &amp; always available
    </div>
  </div>

  <script>
    // ==================== CONFIGURATION ====================
    // 🔥 REPLACE THESE WITH YOUR ACTUAL VALUES
    const firebaseConfig = {
  apiKey: "AIzaSyC9RLegycn1D7QkFshepdE5hj0KJFJF68M",
  authDomain: "olivia-a6e60.firebaseapp.com",
  databaseURL: "https://olivia-a6e60-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "olivia-a6e60",
  storageBucket: "olivia-a6e60.firebasestorage.app",
  messagingSenderId: "184840699254",
  appId: "1:184840699254:web:71f438ef2f7d04a3f8ce57",
  measurementId: "G-RBQCS16HP9"
};

    const CLOUDINARY_CLOUD_NAME = "xb8j8gkd";
    const CLOUDINARY_UPLOAD_PRESET = "olivia_uploads";

    // Firebase
    let db, storageRef;

    // Tailwind script already loaded
    document.documentElement.style.setProperty('--tw-ring-color', '#4f46e5');

    // ==================== FIREBASE INITIALIZATION ====================
    async function initFirebase() {
      // Import Firebase SDK dynamically (recommended for minimal bundle)
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
      const { getFirestore } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
      const { getStorage } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js");

      // Initialize
      const app = initializeApp(FIREBASE_CONFIG);
      db = getFirestore(app);
      storageRef = getStorage(app);

      // Load gallery
      loadGallery();
    }

    // ==================== CLOUDINARY UPLOAD HELPERS ====================
    async function uploadImageToCloudinary(file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
      formData.append("folder", "holly-movers-gallery");

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: "POST",
        body: formData
      });

      if (!response.ok) throw new Error("Cloudinary upload failed");
      const data = await response.json();
      return data.secure_url;
    }

    // ==================== FIREBASE UPLOAD HELPERS ====================
    async function uploadImageToFirebase(file) {
      const timestamp = Date.now();
      const uniqueName = `holly-movers/${timestamp}-${file.name}`;
      const fileRef = storageRef.ref(uniqueName);
      const snapshot = await fileRef.put(file);
      return await snapshot.ref.getDownloadURL();
    }

    // ==================== ADD TO FIREBASE ====================
    async function addToFirebase(imageUrl, description = "") {
      try {
        await db.collection("gallery").add({
          imageUrl,
          description: description.trim(),
          timestamp: new Date()
        });
      } catch (error) {
        console.error("Firebase error:", error);
        alert("Failed to save description. Your photo is still on Cloudinary.");
      }
    }

    // ==================== LOAD GALLERY ====================
    async function loadGallery() {
      const grid = document.getElementById("galleryGrid");

      try {
        const snapshot = await db.collection("gallery")
          .orderBy("timestamp", "desc")
          .get();

        if (snapshot.empty) {
          grid.innerHTML = `
            <div class="md:col-span-3 text-center py-20">
              <i class="fa-solid fa-image text-6xl text-gray-300 mb-4"></i>
              <p class="text-gray-400">No photos yet. Upload your first moment!</p>
            </div>`;
          return;
        }

        grid.innerHTML = "";

        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");
          div.className = "group relative overflow-hidden rounded-3xl aspect-square shadow-md";
          div.innerHTML = `
            <img src="${data.imageUrl}" 
                 class="w-full h-full object-cover transition-transform group-hover:scale-110"
                 alt="${data.description || 'Holly Movers moment'}">
            <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent opacity-0 group-hover:opacity-100 transition-all flex items-end p-6">
              ${data.description ? `
                <p class="text-white text-sm font-medium">${data.description}</p>
              ` : ''}
            </div>
          `;
          grid.appendChild(div);
        });

      } catch (error) {
        console.error("Load error:", error);
        grid.innerHTML = `<div class="col-span-3 text-center text-red-500 py-8">Gallery failed to load. Please refresh.</div>`;
      }
    }

    // ==================== FORM HANDLER ====================
    function setupUploadForm() {
      const form = document.getElementById("uploadForm");
      const fileInput = document.getElementById("photoInput");
      const descInput = document.getElementById("descriptionInput");
      const previewDiv = document.getElementById("photoPreview");
      const previewImg = document.getElementById("previewImage");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const file = fileInput.files[0];
        if (!file) {
          alert("Please select a photo");
          return;
        }

        const description = descInput.value.trim();

        // Show preview
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewImg.src = ev.target.result;
          previewDiv.classList.remove("hidden");
        };
        reader.readAsDataURL(file);

        // Upload both platforms
        const [cloudinaryUrl, firebaseUrl] = await Promise.all([
          uploadImageToCloudinary(file),
          uploadImageToFirebase(file)
        ]);

        // Save description to Firebase (Cloudinary already has the image)
        await addToFirebase(firebaseUrl, description);

        // Reset form
        form.reset();
        previewDiv.classList.add("hidden");

        // Refresh gallery
        loadGallery();

        // Success message
        const toast = document.createElement("div");
        toast.className = "fixed bottom-8 right-8 bg-green-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3";
        toast.innerHTML = `
          <i class="fa-solid fa-check-circle"></i>
          <span>Photo uploaded successfully!</span>
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      });
    }

    // ==================== START THE APP ====================
    window.onload = function() {
      // Make sure user replaced config
      if (FIREBASE_CONFIG.apiKey === "YOUR_FIREBASE_API_KEY") {
        alert("🔴 Please replace the Firebase config values with your real credentials.\n\nOpen the HTML file and edit the FIREBASE_CONFIG object at the top.");
        return;
      }

      // Initialize
      initFirebase();
      setupUploadForm();
    };
  </script>
</body>
</html>
