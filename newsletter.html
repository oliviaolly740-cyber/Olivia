<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter - HOLLY MOVERS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #1f2937; }
    h1, h2, .heading { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-2xl mx-auto px-6 py-20 text-center">
    <h1 class="heading text-5xl md:text-6xl">Weekly Move Insights</h1>
    <p class="text-xl text-gray-600 mt-6">Expert tips, discounts, and new routes delivered to your inbox.</p>
    <form id="newsletterForm" class="mt-10 flex flex-col md:flex-row gap-4">
      <input type="email" id="nlEmail" placeholder="Your email address" class="form-input flex-1 border border-gray-300 focus:border-blue-600 rounded-3xl px-7 py-5 text-lg">
      <button type="submit" class="btn-blue px-10 rounded-3xl font-semibold text-lg">SUBSCRIBE</button>
    </form>
  </div>
</body>
</html>
