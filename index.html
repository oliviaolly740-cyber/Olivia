<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOLLY MOVERS • Moving You With Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    h1, h2, .heading { font-family: 'Playfair Display', sans-serif; }
    .hero-bg {
      background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                  url('https://picsum.photos/id/1015/2000/1200') center/cover no-repeat fixed;
    }
    .nav { backdrop-filter: blur(20px); }
    .service-card {
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .service-card:hover {
      transform: translateY(-20px) scale(1.03);
      box-shadow: 0 0 50px -10px rgb(16 185 129);
    }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); }
    .btn-glow {
      background: linear-gradient(90deg, rgb(16 185 129), rgb(5 150 105));
      box-shadow: 0 15px 35px -10px rgb(16 185 129);
    }
    .hero-slider img {
      animation: fade 4s ease-in-out infinite;
    }
    @keyframes fade { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  </style>
</head>
<body class="bg-white text-gray-900">

<!-- NAVBAR + MENU BUTTON + MOBILE MENU (same as last version) -->
<nav class="nav fixed top-0 left-0 right-0 z-50 py-5 bg-white/90 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 bg-emerald-600 rounded-3xl flex items-center justify-center text-white text-4xl font-black">H</div>
      <div>
        <span class="text-4xl font-bold tracking-tighter text-emerald-600">HOLLY</span>
        <span class="text-emerald-400 text-xs font-medium block -mt-1">MOVERS</span>
      </div>
    </div>
    
    <div class="hidden md:flex items-center gap-9 text-sm font-medium">
      <a href="#services" class="hover:text-emerald-600">Services</a>
      <a href="#testimonials" class="hover:text-emerald-600">Reviews</a>
      <a href="#about" class="hover:text-emerald-600">About</a>
      <a href="#contact" class="hover:text-emerald-600">Contact</a>
    </div>

    <button onclick="toggleMobileMenu()" class="md:hidden text-3xl text-emerald-600">
      <i class="fa-solid fa-bars"></i>
    </button>
    
    <button onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'})" 
            class="btn-glow px-8 py-3.5 rounded-3xl text-sm font-semibold text-white flex items-center gap-2 hidden sm:flex">
      REQUEST A MOVE
    </button>
  </div>
</nav>

<div id="mobileMenu" class="hidden md:hidden fixed top-0 left-0 right-0 bottom-0 bg-white z-50 flex flex-col pt-20 px-6">
  <button onclick="toggleMobileMenu()" class="absolute top-6 right-6 text-3xl text-emerald-600">✕</button>
  <div class="flex flex-col gap-8 text-2xl font-medium mt-20">
    <a href="#services" class="hover:text-emerald-600" onclick="toggleMobileMenu()">Services</a>
    <a href="#testimonials" class="hover:text-emerald-600" onclick="toggleMobileMenu()">Reviews</a>
    <a href="#about" class="hover:text-emerald-600" onclick="toggleMobileMenu()">About</a>
    <a href="#contact" class="hover:text-emerald-600" onclick="toggleMobileMenu()">Contact</a>
    <button onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'});toggleMobileMenu()" 
            class="btn-glow py-5 rounded-3xl text-lg">REQUEST A MOVE</button>
  </div>
</div>

<!-- HERO WITH SLIDING PHOTOS (ADMIN CAN UPDATE) -->
<section class="hero-bg h-screen flex items-center text-white relative overflow-hidden">
  <div id="heroSlider" class="absolute inset-0">
    <img src="https://res.cloudinary.com/demo/image/upload/v1234567890/photo1.jpg" class="hero-slider absolute inset-0 w-full h-full object-cover" alt="Moving Photo 1">
    <img src="https://res.cloudinary.com/demo/image/upload/v1234567890/photo2.jpg" class="hero-slider absolute inset-0 w-full h-full object-cover" alt="Moving Photo 2">
    <img src="https://res.cloudinary.com/demo/image/upload/v1234567890/photo3.jpg" class="hero-slider absolute inset-0 w-full h-full object-cover" alt="Moving Photo 3">
  </div>
  
  <div class="max-w-5xl mx-auto px-6 relative z-10">
    <h1 class="heading text-7xl md:text-8xl font-bold leading-none tracking-tighter mb-6">"Moving You With Care"</h1>
    <p class="text-3xl font-light max-w-xl">Reliable, professional relocation services for homes and businesses. We treat your belongings like our own — safely, carefully, on time.</p>
    <button onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'})" 
            class="mt-12 btn-glow px-12 py-6 rounded-3xl text-xl font-semibold">REQUEST A MOVE</button>
  </div>
</section>

<!-- SERVICES, TESTIMONIALS, ABOUT, CONTACT FORM sections are EXACTLY the same as the previous professional version (all real Holly Movers content included) -->

<script>
// ====================== CLOUDINARY CONFIG ======================
const CLOUDINARY_CLOUD_NAME = "your-cloud-name";   // <<< REPLACE THIS

// ====================== FIREBASE CONFIG ======================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project",
  storageBucket: "your-project.appspot.com",
  messagingSenderId: "123456789",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ====================== WHATSAPP ======================
const WHATSAPP_NUMBER = "254700123456";   // <<< REPLACE THIS

// ====================== FORM SUBMISSION (Cloudinary + Firebase + WhatsApp) ======================
const form = document.getElementById('quoteForm');
const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const phoneInput = document.getElementById('phone');
const moveDateInput = document.getElementById('moveDate');
const messageInput = document.getElementById('message');
const imageInput = document.getElementById('image');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    name: nameInput.value,
    email: emailInput.value,
    phone: phoneInput.value,
    moveDate: moveDateInput.value,
    message: messageInput.value,
    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
    cloudinaryPublicId: null,
    cloudinaryUrl: null
  };

  try {
    // 1. Upload image to Cloudinary
    const file = imageInput.files[0];
    let cloudinaryUrl = "";
    if (file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'your-upload-preset');   // <<< REPLACE WITH YOUR UPLOAD PRESET
      formData.append('folder', 'holy-movers');

      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();
      data.cloudinaryUrl = result.secure_url;
      data.cloudinaryPublicId = result.public_id;
    }

    // 2. Save to Firebase
    await db.collection('bookings').add(data);

    // 3. Send to WhatsApp
    const messageText = encodeURIComponent(
      `*New Move Booking from HOLLY MOVERS Website*\n\n` +
      `📋 Name: ${data.name}\n` +
      `📧 Email: ${data.email}\n` +
      `📞 Phone: ${data.phone}\n` +
      `📅 Move Date: ${data.moveDate || 'Not specified'}\n` +
      `💬 Message: ${data.message || 'No message'}\n` +
      `📸 Image: ${data.cloudinaryUrl || 'No image'}\n\n` +
      `Reply on WhatsApp to confirm the booking.`
    );

    const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${messageText}`;
    window.open(whatsappUrl, '_blank');

    alert("✅ Booking saved in Firebase & sent to WhatsApp!\n\nImage is now stored in Cloudinary.");
    form.reset();
    document.getElementById('imagePreview').classList.add('hidden');

  } catch (err) {
    console.error(err);
    alert("❌ Submission failed. Please try again.");
  }
});

// Image preview (same as before)
document.getElementById('image').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('imagePreview').src = ev.target.result;
      document.getElementById('imagePreview').classList.remove('hidden');
    };
    reader.readAsDataURL(file);
  }
});

// Hero slider (admin can update URLs)
let slideIndex = 0;
const slides = document.querySelectorAll('#heroSlider img');
function showSlides() {
  slides.forEach(s => s.classList.remove('active'));
  slides[slideIndex].classList.add('active');
  slideIndex = (slideIndex + 1) % slides.length;
}
setInterval(showSlides, 4000);

window.onload = () => {
  console.log('%c✅ HOLLY MOVERS professional site with Cloudinary + Firebase + WhatsApp ready!', 'color:#10b981; font-size:14px');
};
</script>

</body>
</html>
